<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acompanhamento do TCC</title>
<meta name="description" content="Últimas atualizações do Trabalho de Conclusão de Curso do João Pedro.">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --fundo: #f6f5f1;
    --cartao: #ffffff;
    --texto: #1f2328;
    --suave: #6b7280;
    --linha: #e3e1da;
    --texto-cor: #7a4b12;
    --texto-fundo: #fbefdc;
    --codigo-cor: #1d5a8a;
    --codigo-fundo: #e2eff9;
    --documentacao-cor: #2c6a3a;
    --documentacao-fundo: #e1f2e4;
    --novo: #fff6cf;
    --aviso-cor: #8a3b12;
    --aviso-fundo: #fdeee4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #15171a;
      --cartao: #1e2125;
      --texto: #e8e6e1;
      --suave: #9aa1ab;
      --linha: #2e3238;
      --texto-cor: #f0c486;
      --texto-fundo: #3b2c16;
      --codigo-cor: #9ccbf0;
      --codigo-fundo: #1b3346;
      --documentacao-cor: #a3d9ad;
      --documentacao-fundo: #1c3a24;
      --novo: #3a3418;
      --aviso-cor: #f3b594;
      --aviso-fundo: #3a2318;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 16px 64px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.7rem;
    line-height: 1.2;
    text-wrap: balance;
  }
  .subtitulo {
    margin: 0 0 20px;
    color: var(--suave);
    text-wrap: pretty;
  }
  .situacao {
    margin: 0 0 8px;
    color: var(--suave);
    font-size: 0.9rem;
  }
  .acoes {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    margin: 0 0 16px;
    color: var(--suave);
    font-size: 0.9rem;
  }
  button {
    padding: 8px 16px;
    border: 1px solid var(--linha);
    border-radius: 999px;
    background: var(--cartao);
    color: var(--texto);
    font: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .aviso {
    margin: 0 0 16px;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--aviso-fundo);
    color: var(--aviso-cor);
    font-size: 0.95rem;
  }
  .legenda {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    margin: 0 0 8px;
    padding: 0;
    list-style: none;
    color: var(--suave);
    font-size: 0.9rem;
  }
  h2 {
    margin: 28px 0 10px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--suave);
  }
  h2::first-letter { text-transform: uppercase; }
  ol {
    margin: 0;
    padding: 0;
    list-style: none;
    background: var(--cartao);
    border: 1px solid var(--linha);
    border-radius: 14px;
    overflow: hidden;
  }
  li.item {
    padding: 14px 16px;
    border-top: 1px solid var(--linha);
    transition: background-color 4s ease-out;
  }
  li.item:first-child { border-top: 0; }
  li.item.novo { background: var(--novo); transition: none; }
  .mensagem {
    margin: 0 0 6px;
    overflow-wrap: anywhere;
  }
  .rodape {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    color: var(--suave);
    font-size: 0.88rem;
  }
  .etiqueta {
    padding: 1px 9px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .etiqueta.texto { color: var(--texto-cor); background: var(--texto-fundo); }
  .etiqueta.codigo { color: var(--codigo-cor); background: var(--codigo-fundo); }
  .etiqueta.documentacao { color: var(--documentacao-cor); background: var(--documentacao-fundo); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Acompanhamento do TCC</h1>
  <p class="subtitulo">Tudo o que o João Pedro vai registrando no trabalho aparece aqui, do mais recente para o mais antigo.</p>

  <ul class="legenda">
    <li><span class="etiqueta texto">Texto da monografia</span> o documento escrito</li>
    <li><span class="etiqueta codigo">Códigos</span> os programas das simulações</li>
    <li><span class="etiqueta documentacao">Documentação</span> decisões e estudos do trabalho</li>
  </ul>

  <p class="situacao" id="situacao" aria-live="polite">Carregando…</p>
  <div class="acoes" id="acoes" hidden>
    <button type="button" id="instalar" hidden>Instalar no celular</button>
    <button type="button" id="ativar-avisos" hidden>Avisar-me das novidades</button>
    <span id="avisos-texto" role="status" hidden></span>
    <button type="button" id="desativar-avisos" hidden>Desativar</button>
  </div>
  <p class="aviso" id="aviso" role="status" hidden></p>

  <div id="lista"></div>
</main>

<script>
(function () {
  'use strict';

  // A mesma lista existe em worker/src/fontes.js (FONTES). Ao mudar uma, mude a outra.
  var FONTES = [
    { repo: 'VoidSeeder/PFC-Monography', rotulo: 'Texto da monografia', classe: 'texto' },
    { repo: 'VoidSeeder/cfd_on_gpu', rotulo: 'Códigos', classe: 'codigo' },
    { anotacoes: 'https://gist.githubusercontent.com/VoidSeeder/5a882a39e3d93b55f8cd31370f88aee6/raw/anotacoes.json', rotulo: 'Documentação', classe: 'documentacao' }
  ];
  var POR_FONTE = 30;
  var INTERVALO_MS = 5 * 60 * 1000;
  var MINIMO_ENTRE_CONSULTAS_MS = 60 * 1000;
  var CHAVE_SALVA = 'tcc-lista';

  // Worker de avisos (pasta worker/). A página só depende dele para os avisos, nunca para a
  // lista. Com AVISOS_URL vazio, o bloco de avisos não aparece.
  var AVISOS_URL = 'https://tcc-avisos.tcc-avisos.workers.dev';
  // Igual a VAPID_PUBLIC_KEY em worker/wrangler.toml.
  var AVISOS_CHAVE_PUBLICA = 'BLw60B8eFuoqlp6iTWKlaPxY7v2f13Kl7QwlNi_sG29ym5Gtj2GxYdV5ndnSEAVxHhDUmNSRgJFDcfWqZD0P6x8';

  var elLista = document.getElementById('lista');
  var elSituacao = document.getElementById('situacao');
  var elAviso = document.getElementById('aviso');
  var elAcoes = document.getElementById('acoes');
  var elInstalar = document.getElementById('instalar');
  var elAtivar = document.getElementById('ativar-avisos');
  var elDesativar = document.getElementById('desativar-avisos');
  var elAvisosTexto = document.getElementById('avisos-texto');

  // Última resposta boa de cada fonte; se uma consulta falhar, a anterior continua valendo.
  var porFonte = {};
  var vistos = null;
  var ultimaConsulta = 0;
  var ultimaAtualizacao = null;
  var consultando = false;

  var fmtHora = new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' });
  var fmtDia = new Intl.DateTimeFormat('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  var fmtDiaAno = new Intl.DateTimeFormat('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' });

  function hora(data) {
    return fmtHora.format(data).replace(':', 'h');
  }

  function chaveDoDia(data) {
    return data.getFullYear() + '-' + data.getMonth() + '-' + data.getDate();
  }

  function nomeDoDia(data, agora) {
    var inicioHoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
    var inicioDia = new Date(data.getFullYear(), data.getMonth(), data.getDate());
    var dias = Math.round((inicioHoje - inicioDia) / 86400000);
    if (dias === 0) return 'Hoje';
    if (dias === 1) return 'Ontem';
    if (data.getFullYear() === agora.getFullYear()) return fmtDia.format(data);
    return fmtDiaAno.format(data);
  }

  function buscar(fonte) {
    return fonte.repo ? buscarCommits(fonte) : buscarAnotacoes(fonte);
  }

  function buscarAnotacoes(fonte) {
    // O endereço "raw" do Gist fica 5 minutos no cache da CDN e mais 5 no do navegador; o
    // parâmetro muda a cada consulta para trazer sempre a revisão atual.
    return fetch(fonte.anotacoes + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (resposta) {
        if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
        return resposta.json();
      })
      .then(function (anotacoes) {
        return anotacoes.map(function (a) {
          return {
            id: a.data + ' ' + a.texto,
            mensagem: a.texto,
            data: new Date(a.data),
            fonte: fonte
          };
        }).filter(function (item) { return !isNaN(item.data); });
      });
  }

  function buscarCommits(fonte) {
    var url ='https://api.github.com/repos/' + fonte.repo + '/commits?per_page=' + POR_FONTE;
    return fetch(url, { headers: { Accept: 'application/vnd.github+json' } })
      .then(function (resposta) {
        if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
        return resposta.json();
      })
      .then(function (commits) {
        return commits.map(function (c) {
          return {
            id: c.sha,
            mensagem: c.commit.message.split('\n')[0].trim(),
            data: new Date(c.commit.committer.date),
            fonte: fonte
          };
        });
      });
  }

  function desenhar(novos) {
    var itens = [];
    FONTES.forEach(function (fonte, i) {
      itens = itens.concat(porFonte[i] || []);
    });
    itens.sort(function (a, b) { return b.data - a.data; });

    var agora = new Date();
    var fragmento = document.createDocumentFragment();
    var diaAtual = null;
    var grupo = null;

    itens.forEach(function (item) {
      var chave = chaveDoDia(item.data);
      if (chave !== diaAtual) {
        diaAtual = chave;
        var titulo = document.createElement('h2');
        titulo.textContent = nomeDoDia(item.data, agora);
        fragmento.appendChild(titulo);
        grupo = document.createElement('ol');
        fragmento.appendChild(grupo);
      }

      var li = document.createElement('li');
      li.className = 'item' + (novos[item.id] ? ' novo' : '');

      var mensagem = document.createElement('p');
      mensagem.className = 'mensagem';
      mensagem.textContent = item.mensagem;

      var rodape = document.createElement('div');
      rodape.className = 'rodape';
      var etiqueta = document.createElement('span');
      etiqueta.className = 'etiqueta ' + item.fonte.classe;
      etiqueta.textContent = item.fonte.rotulo;
      var quando = document.createElement('time');
      quando.dateTime = item.data.toISOString();
      quando.textContent = 'às ' + hora(item.data);
      rodape.appendChild(etiqueta);
      rodape.appendChild(quando);

      li.appendChild(mensagem);
      li.appendChild(rodape);
      grupo.appendChild(li);
    });

    elLista.replaceChildren(fragmento);

    // Tira o destaque no quadro seguinte para a cor desbotar aos poucos.
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        elLista.querySelectorAll('.novo').forEach(function (el) { el.classList.remove('novo'); });
      });
    });
  }

  function mostrarSituacao() {
    if (!ultimaAtualizacao) return;
    elSituacao.textContent = 'Atualizado ' + nomeDoDia(ultimaAtualizacao, new Date()).toLowerCase() +
      ' às ' + hora(ultimaAtualizacao) + '. Esta página se atualiza sozinha.';
  }

  // Guarda a última lista para o app abrir sem internet. Cada fonte é gravada pela sua
  // classe, e não pela posição em FONTES, para a ordem poder mudar sem trocar os rótulos.
  function salvar() {
    try {
      var itens = {};
      FONTES.forEach(function (fonte, i) {
        if (!porFonte[i]) return;
        itens[fonte.classe] = porFonte[i].map(function (item) {
          return { id: item.id, mensagem: item.mensagem, data: item.data.toISOString() };
        });
      });
      localStorage.setItem(CHAVE_SALVA, JSON.stringify({
        porFonte: itens,
        ultimaAtualizacao: ultimaAtualizacao ? ultimaAtualizacao.toISOString() : null
      }));
    } catch (erro) {
      // Sem localStorage (ou cheio): a página segue funcionando, só não abre sem internet.
    }
  }

  // Desenha o que ficou salvo da última visita. Qualquer problema no que foi salvo faz a
  // página abrir como se não houvesse nada salvo.
  function carregarSalvo() {
    try {
      var salvo = JSON.parse(localStorage.getItem(CHAVE_SALVA));
      var lido = {};
      var total = 0;
      FONTES.forEach(function (fonte, i) {
        var itens = salvo.porFonte[fonte.classe];
        if (!Array.isArray(itens)) return;
        lido[i] = itens.map(function (item) {
          return { id: String(item.id), mensagem: String(item.mensagem), data: new Date(item.data), fonte: fonte };
        }).filter(function (item) { return !isNaN(item.data); });
        total += lido[i].length;
      });
      if (total === 0) return;

      var quando = salvo.ultimaAtualizacao ? new Date(salvo.ultimaAtualizacao) : null;
      porFonte = lido;
      ultimaAtualizacao = quando && !isNaN(quando) ? quando : null;
      // "vistos" continua vazio de propósito: a primeira consulta não destaca nada, como sempre foi.
      desenhar({});
      mostrarSituacao();
    } catch (erro) {
      // Nada salvo, formato antigo ou localStorage indisponível.
    }
  }

  function atualizar() {
    if (consultando) return;
    consultando = true;
    ultimaConsulta = Date.now();

    Promise.allSettled(FONTES.map(buscar)).then(function (resultados) {
      var falhas = 0;
      resultados.forEach(function (resultado, i) {
        if (resultado.status === 'fulfilled') porFonte[i] = resultado.value;
        else falhas++;
      });

      var temAlgo = Object.keys(porFonte).length > 0;
      var novos = {};
      if (temAlgo) {
        var agoraVistos = {};
        Object.keys(porFonte).forEach(function (i) {
          porFonte[i].forEach(function (item) {
            agoraVistos[item.id] = true;
            if (vistos && !vistos[item.id]) novos[item.id] = true;
          });
        });
        vistos = agoraVistos;
        desenhar(novos);
      }

      if (falhas === 0) {
        ultimaAtualizacao = new Date();
        elAviso.hidden = true;
        mostrarSituacao();
      } else if (temAlgo) {
        elAviso.textContent = 'Não foi possível buscar as novidades agora. A lista abaixo pode estar incompleta; a página tenta de novo em alguns minutos.';
        elAviso.hidden = false;
        if (ultimaAtualizacao) mostrarSituacao();
        else elSituacao.textContent = '';
      } else {
        elAviso.textContent = 'Não foi possível carregar as atualizações agora. A página tenta de novo sozinha em alguns minutos.';
        elAviso.hidden = false;
        elSituacao.textContent = '';
      }

      if (falhas < resultados.length) salvar();
    }).finally(function () {
      consultando = false;
    });
  }

  // O bloco de botões some inteiro quando não há nada a mostrar, para a página ficar como era.
  function ajustarAcoes() {
    elAcoes.hidden = !elAcoes.querySelector(':scope > :not([hidden])');
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {
      // Sem service worker a página funciona como antes; só não abre sem internet nem avisa.
    });
  }

  var pedidoDeInstalacao = null;
  window.addEventListener('beforeinstallprompt', function (evento) {
    evento.preventDefault();
    pedidoDeInstalacao = evento;
    elInstalar.hidden = false;
    ajustarAcoes();
  });
  elInstalar.addEventListener('click', function () {
    if (!pedidoDeInstalacao) return;
    pedidoDeInstalacao.prompt();
    // O pedido só vale uma vez; se a pessoa recusar, o navegador dispara outro mais tarde.
    pedidoDeInstalacao = null;
    elInstalar.hidden = true;
    ajustarAcoes();
  });
  window.addEventListener('appinstalled', function () {
    pedidoDeInstalacao = null;
    elInstalar.hidden = true;
    ajustarAcoes();
  });

  var TEXTOS_DOS_AVISOS = {
    ativado: 'Avisos ativados neste aparelho.',
    bloqueado: 'Os avisos estão bloqueados nas configurações do navegador.',
    falha: 'Não foi possível ativar os avisos agora. Tente de novo mais tarde.'
  };

  // situacao: 'desativado', 'ativado', 'bloqueado' ou 'falha'.
  function mostrarAvisos(situacao) {
    var texto = TEXTOS_DOS_AVISOS[situacao] || '';
    elAtivar.hidden = situacao !== 'desativado' && situacao !== 'falha';
    elAtivar.disabled = false;
    elDesativar.hidden = situacao !== 'ativado';
    elDesativar.disabled = false;
    elAvisosTexto.textContent = texto;
    elAvisosTexto.hidden = !texto;
    ajustarAcoes();
  }

  function chaveEmBytes(base64url) {
    var binario = atob(base64url.replace(/-/g, '+').replace(/_/g, '/'));
    var bytes = new Uint8Array(binario.length);
    for (var i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
    return bytes;
  }

  function inscricaoAtual() {
    return navigator.serviceWorker.ready.then(function (registro) {
      return registro.pushManager.getSubscription();
    });
  }

  function falarComWorker(metodo, corpo) {
    return fetch(AVISOS_URL + '/inscricoes', {
      method: metodo,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(corpo)
    }).then(function (resposta) {
      if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
    });
  }

  function conferirAvisos() {
    if (Notification.permission === 'denied') {
      mostrarAvisos('bloqueado');
      return;
    }
    inscricaoAtual().then(function (inscricao) {
      mostrarAvisos(inscricao ? 'ativado' : 'desativado');
      // Reenvia a inscrição ao Worker a cada abertura, em silêncio: se o primeiro envio não
      // chegou (app fechado no meio) ou o Worker a perdeu, ela volta a valer. Uma falha aqui
      // não muda o que a página mostra.
      if (inscricao) falarComWorker('POST', inscricao.toJSON()).catch(function () {});
    }).catch(function () {
      // Sem service worker funcionando não há como avisar; o bloco fica escondido.
    });
  }

  function inscrever() {
    return navigator.serviceWorker.ready.then(function (registro) {
      return registro.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: chaveEmBytes(AVISOS_CHAVE_PUBLICA)
      });
    }).then(function (inscricao) {
      return falarComWorker('POST', inscricao.toJSON()).catch(function (erro) {
        // O Worker não recebeu: desfaz a inscrição no navegador para não ficar meio ativada.
        var repassar = function () { throw erro; };
        return inscricao.unsubscribe().then(repassar, repassar);
      });
    });
  }

  function ativarAvisos() {
    elAtivar.disabled = true;
    Notification.requestPermission().then(function (permissao) {
      if (permissao !== 'granted') {
        mostrarAvisos(permissao === 'denied' ? 'bloqueado' : 'desativado');
        return;
      }
      return inscrever().then(function () { mostrarAvisos('ativado'); });
    }).catch(function () {
      mostrarAvisos('falha');
    });
  }

  function desativarAvisos() {
    elDesativar.disabled = true;
    inscricaoAtual().then(function (inscricao) {
      if (!inscricao) return;
      var endpoint = inscricao.endpoint;
      return inscricao.unsubscribe().then(function () {
        // Se o Worker não responder agora, ele apaga a inscrição sozinho no próximo envio,
        // quando o serviço de push disser que ela não existe mais.
        return falarComWorker('DELETE', { endpoint: endpoint }).catch(function () {});
      });
    }).then(conferirAvisos, conferirAvisos);
  }

  if (AVISOS_URL && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window) {
    elAtivar.addEventListener('click', ativarAvisos);
    elDesativar.addEventListener('click', desativarAvisos);
    conferirAvisos();
  }

  carregarSalvo();
  atualizar();
  setInterval(atualizar, INTERVALO_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Date.now() - ultimaConsulta > MINIMO_ENTRE_CONSULTAS_MS) atualizar();
  });
})();
</script>
</body>
</html>
